<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal-II Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .terminal-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 25px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 20px;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #f0f6fc;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240,246,2fc,0.1);
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2ea44f;
        }
        /* New Output Window Styling */
        .outputs-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .outputs-wrapper { grid-template-columns: 1fr; }
        }
        .output-box {
            background-color: #05070a;
            border: 1px solid #21262d;
            border-radius: 4px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            color: #7ee787; /* Terminal Green text for AI outputs */
        }
        .output-title {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <h1>CRYSTAL-II DUAL ENGINE</h1>
    
    <div class="input-group">
        <label for="ticker">STOCK TICKER</label>
        <input type="text" id="ticker" placeholder="e.g. AAPL">
    </div>
    
    <div class="input-group">
        <label for="query1">CHAIN A QUERY (Technical / Fundamental)</label>
        <textarea id="query1" placeholder="Enter first analysis directive..."></textarea>
    </div>
    
    <div class="input-group">
        <label for="query2">CHAIN B QUERY (Sentiment / Macro)</label>
        <textarea id="query2" placeholder="Enter second analysis directive..."></textarea>
    </div>
    
    <button id="executeBtn" onclick="runDualEngine()">EXECUTE DUAL ANALYSIS</button>

    <div class="outputs-wrapper">
        <div>
            <div class="output-title">Chain A Output Live Stream</div>
            <div id="outputA" class="output-box">System idle. Awaiting execution...</div>
        </div>
        <div>
            <div class="output-title">Chain B Output Live Stream</div>
            <div id="outputB" class="output-box">System idle. Awaiting execution...</div>
        </div>
    </div>
</div>

<script>
    function runDualEngine() {
        const ticker = document.getElementById('ticker').value;
        const query1 = document.getElementById('query1').value;
        const query2 = document.getElementById('query2').value;
        const btn = document.getElementById('executeBtn');

        if(!ticker || !query1 || !query2) {
            alert('Please fill out all fields before executing.');
            return;
        }

        // Update status windows
        document.getElementById('outputA').innerText = 'Firing Chain A... Analysing...';
        document.getElementById('outputB').innerText = 'Firing Chain B... Analysing...';
        btn.innerText = 'PROCESSING...';
        btn.disabled = true;

        // TARGET URL: Replace this placeholder with your Parent Router Webhook URL
        const webhookUrl = 'https://hook.eu1.make.com/7doseugkce8fpkhgi7fdorg5rvy26hva';

        // Fire data to your Parent Router
        fetch(`${webhookUrl}?ticker=${encodeURIComponent(ticker)}&query1=${encodeURIComponent(query1)}&query2=${encodeURIComponent(query2)}`)
        .then(response => {
            btn.innerText = 'EXECUTE DUAL ANALYSIS';
            btn.disabled = false;
            
            document.getElementById('outputA').innerText = 'Chain A deployed successfully to cloud background runners.';
            document.getElementById('outputB').innerText = 'Chain B deployed successfully to cloud background runners.';
        })
        .catch(error => {
            console.error('Error:', error);
            btn.innerText = 'EXECUTE DUAL ANALYSIS';
            btn.disabled = false;
            document.getElementById('outputA').innerText = 'Error deploying engine.';
            document.getElementById('outputB').innerText = 'Error deploying engine.';
        });
    }
</script>

</body>
</html>
